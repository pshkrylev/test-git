{% extends 'base.html' %}

{% block title %}Удаление объявления{% endblock %}

{% block content %}
<h2>Удаление объявления</h2>
<p>Вы уверены, что хотите удалить "{{ post.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'post_detail' post.id %}" class="btn btn-primary">Отмена</a>
</form>
{% endblock %}
