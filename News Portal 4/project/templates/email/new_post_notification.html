<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .post-title { font-size: 1.5em; color: #2c3e50; }
        .button { display: inline-block; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px; }
        .footer { margin-top: 20px; padding-top: 10px; border-top: 1px solid #ddd; font-size: 0.8em; color: #666; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>News Portal</h1>
        </div>
        <div class="content">
            <h2>Здравствуйте, {{ user.username }}!</h2>
            <p>В категории <strong>{{ category.name }}</strong> появилась новая статья:</p>

            <h3 class="post-title">{{ post.title }}</h3>
            <p>{{ post.preview }}</p>

            <p style="text-align: center;">
                <a href="{{ post_url }}" class="button">Читать статью</a>
            </p>
        </div>
        <div class="footer">
            <p>Это письмо было отправлено автоматически. Пожалуйста, не отвечайте на него.</p>
            <p>Вы можете отписаться от рассылки на странице категории.</p>
        </div>
    </div>
</body>
</html>
